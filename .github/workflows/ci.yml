name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project TrackingInspector.xcodeproj -scheme TrackingInspector -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/xcode test
      - run: node --test Tests/*.test.mjs
      - run: bash Scripts/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Tracking-Inspector-Apple-Silicon
          path: |
            dist/*.zip
            dist/*-arm64.dmg
            dist/SHA256SUMS
