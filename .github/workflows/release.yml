name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project TrackingInspector.xcodeproj -scheme TrackingInspector -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/xcode test
      - run: node --test Tests/*.test.mjs
      - run: bash Scripts/build-dmg.sh
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' 'dist/Tracking Inspector.app/Contents/Info.plist')
          test "$RELEASE_TAG" = "v$version"
          test -f "Docs/releases/$RELEASE_TAG.md"
      - name: Publish DMG and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "dist/Tracking-Inspector-${RELEASE_TAG#v}-arm64.dmg" dist/Tracking-Inspector.zip dist/SHA256SUMS \
            --verify-tag --title "Tracking Inspector $RELEASE_TAG" --notes-file "Docs/releases/$RELEASE_TAG.md"
